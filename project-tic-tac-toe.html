<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe Game | Emileen Niyomugabo</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .tic-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(58,122,191,0.15);
            text-align: center;
        }

        .tic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            margin-top: 20px;
            border: 3px solid black;
        }

        .tic-cell {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid black;
            font-size: 48px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tic-cell.x {
            color: #3a7abf; /* Blue X */
        }

        .tic-cell.o {
            color: #d9534f; /* Red O */
        }

        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #3a7abf;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            display: inline-block;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #2f5f91;
        }

        .back-btn {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 20px;
            background: #444;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #222;
        }
    </style>
</head>

<body>

<div class="container">

    <section class="projects-section">
        <h2>Tic Tac Toe Game</h2>

        <div class="tic-container">
            <p>A clean, simple Tic Tac Toe game built for two players. Detects wins, draws, and allows instant board reset.</p>

            <div id="status" style="margin-top: 10px; font-size: 20px; font-weight: bold; color: #3a7abf;">
                Player X's turn
            </div>

            <div class="tic-grid" id="board">
                <div class="tic-cell" data-index="0"></div>
                <div class="tic-cell" data-index="1"></div>
                <div class="tic-cell" data-index="2"></div>
                <div class="tic-cell" data-index="3"></div>
                <div class="tic-cell" data-index="4"></div>
                <div class="tic-cell" data-index="5"></div>
                <div class="tic-cell" data-index="6"></div>
                <div class="tic-cell" data-index="7"></div>
                <div class="tic-cell" data-index="8"></div>
            </div>

            <div class="reset-btn" id="reset">Reset Game</div>

            <a href="index.html" class="back-btn">← Back to Portfolio</a>
        </div>

    </section>

</div>

<script>
    const board = document.querySelectorAll('.tic-cell');
    const status = document.getElementById('status');
    const resetBtn = document.getElementById('reset');

    let currentPlayer = "X";
    let gameActive = true;
    let gameState = ["", "", "", "", "", "", "", "", ""];

    const winningConditions = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    function checkWin() {
        for (let condition of winningConditions) {
            const [a,b,c] = condition;
            if (gameState[a] && gameState[a] === gameState[b] && gameState[b] === gameState[c]) {
                status.textContent = `Player ${gameState[a]} wins!`;
                gameActive = false;
                return;
            }
        }

        if (!gameState.includes("")) {
            status.textContent = "It's a draw!";
            gameActive = false;
        }
    }

    board.forEach(cell => {
        cell.addEventListener('click', () => {
            const index = cell.dataset.index;

            if (gameState[index] !== "" || !gameActive) return;

            gameState[index] = currentPlayer;
            cell.textContent = currentPlayer;

            if (currentPlayer === "X") {
                cell.classList.add("x");
            } else {
                cell.classList.add("o");
            }

            checkWin();

            if (gameActive) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                status.textContent = `Player ${currentPlayer}'s turn`;
            }
        });
    });

    resetBtn.addEventListener('click', () => {
        gameState = ["", "", "", "", "", "", "", "", ""];
        board.forEach(cell => {
            cell.textContent = "";
            cell.classList.remove("x", "o");
        });
        currentPlayer = "X";
        gameActive = true;
        status.textContent = "Player X's turn";
    });
</script>

</body>
</html>
