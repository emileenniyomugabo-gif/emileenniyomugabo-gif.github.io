<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="600" fill="#FFFFFF"/>

  <!-- Grid (3x3) -->
  <!-- Vertical lines -->
  <line x1="200" y1="100" x2="200" y2="500" stroke="#000000" stroke-width="8"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#000000" stroke-width="8"/>

  <!-- Horizontal lines -->
  <line x1="100" y1="233" x2="500" y2="233" stroke="#000000" stroke-width="8"/>
  <line x1="100" y1="367" x2="500" y2="367" stroke="#000000" stroke-width="8"/>

  <!-- Blue X in top-left cell -->
  <line x1="120" y1="120" x2="180" y2="213" stroke="#3A7ABF" stroke-width="10" stroke-linecap="round"/>
  <line x1="180" y1="120" x2="120" y2="213" stroke="#3A7ABF" stroke-width="10" stroke-linecap="round"/>

  <!-- Red O in center cell -->
  <circle cx="300" cy="300" r="50" fill="none" stroke="#D9534F" stroke-width="10"/>

  <!-- Soft shadow under grid (optional subtle effect) -->
  <rect x="100" y="100" width="400" height="400" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="20"/>
</svg>
